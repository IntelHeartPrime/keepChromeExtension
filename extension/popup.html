<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keep 标记删除线</title><link rel="stylesheet" href="popup.css"></head>
<body><main><div class="eyebrow">KEEP / 阅读增强</div><h1>划掉旧内容，标出重点。</h1><p class="intro">删除线与重点高亮，让笔记更清楚。</p><div class="example">买牛奶，<s>买面包</s><code>买牛奶，~~买面包~~</code></div><label class="setting"><span>启用标记增强</span><input id="enabled" type="checkbox" role="switch" disabled></label><p id="status" role="status">正在读取设置…</p><p class="hint">在正文中选中文字后右键，选择「添加删除线」「删除删除线」「一键高亮」或「一键取消高亮」。编辑当前行和复制保留原始标记。支持可识别的普通正文；标题、清单和复杂格式保持原样。</p><p class="hint">Chrome PWA：在同一浏览器配置文件加载扩展，然后重新打开 Keep。关闭本开关可立即恢复原文。</p></main><script src="popup.js"></script></body></html>
